<!DOCTYPE html>
<html>

<head>
    <title>GraphGuard Dashboard</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        .header {
            background: #1f2937;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            flex: 1;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        button {
            padding: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn1 { background: #3b82f6; color: white; }
        .btn2 { background: #10b981; color: white; }
        .btn3 { background: #f59e0b; color: white; }
        .btn4 { background: #ef4444; color: white; }

    </style>

</head>

<body>

<div class="header">
    <h1>GraphGuard</h1>
    <p>Network Security & Graph Analysis System</p>
</div>

<div class="container">

    <!-- DASHBOARD CARDS -->
    <div class="cards">

        <div class="card">
            <h2>{{ computers|length }}</h2>
            <p>Total Computers</p>
        </div>

        <div class="card">
            <h2>{{ connections|length }}</h2>
            <p>Total Connections</p>
        </div>

        <div class="card">
            <h2>{{ cycle_status }}</h2>
            <p>Cycle Status</p>
        </div>

        <div class="card">
            <h2>{{ risk_level }}</h2>
            <p>Risk Level</p>
        </div>

    </div>

    <!-- ACTION BUTTONS -->
    <div class="actions">

        <button class="btn1" onclick="location.href='/add_computer_page'">
            ➕ Add Computer
        </button>

        <button class="btn2" onclick="location.href='/add_connection_page'">
            🔗 Add Connection
        </button>

        <button class="btn3" onclick="location.href='/analyze'">
            ⚡ Analyze Network
        </button>

        <button class="btn4" onclick="location.href='/simulate_form'">
            🦠 Simulate Malware
        </button>

    </div>

</div>

</body>

</html>
