<!DOCTYPE html>
<html>

<head>

    <title>Malware Simulation</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

</head>

<body>

<h1>Malware Spread Simulation</h1>

<h2>Starting Node: {{ start_node }}</h2>

<div
    id="cy"
    style="
        width:100%;
        height:600px;
        border:2px solid black;
    ">
</div>

<br>

<a href="/">Back to Dashboard</a>

<script>

var elements = {{ cytoscape_data | safe }};

var timeline = {{ timeline_json | safe }};

var cy = cytoscape({

    container: document.getElementById('cy'),

    elements: elements,

    style: [

        {
            selector: 'node',
            style: {
                'label': 'data(id)',
                'background-color': '#4287f5',
                'color': 'black'
            }
        },

        {
            selector: 'edge',
            style: {
                'curve-style': 'bezier',
                'target-arrow-shape': 'triangle'
            }
        }

    ],

    layout: {
        name: 'cose'
    }

});

let index = 0;

function infectNextNode() {

    if(index >= timeline.length)
        return;

    let nodeName = timeline[index][0];

    cy.getElementById(nodeName).style(
        'background-color',
        'red'
    );

    index++;

    setTimeout(
        infectNextNode,
        1000
    );
}

infectNextNode();

</script>

</body>

</html>
