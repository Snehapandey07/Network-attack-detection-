<!DOCTYPE html>
<html>

<head>

    <title>GraphGuard Malware Simulation</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>

    <style>

        body{
            font-family: Arial, sans-serif;
            background:#f4f6f8;
            padding:20px;
        }

        .card{
            background:white;
            padding:20px;
            margin-bottom:20px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        #cy{
            width:100%;
            height:600px;
            border:2px solid #d1d5db;
            border-radius:12px;
            background:white;
        }

        #timeline{
            max-height:250px;
            overflow-y:auto;
            padding:10px;
            border:1px solid #ccc;
            border-radius:8px;
            background:#fafafa;
        }

        .event{
            padding:8px;
            margin-bottom:6px;
            border-left:4px solid red;
            background:#fff;
        }

        .btn{
            background:#2563eb;
            color:white;
            padding:10px 20px;
            border-radius:8px;
            text-decoration:none;
        }

    </style>

</head>

<body>

<div class="card">

    <h1>🦠 Malware Spread Simulation</h1>

    <h2>
        Starting Node:
        {{ start_node }}
    </h2>

    <h3>
        Infection Timeline
    </h3>

    <div id="timeline"></div>

</div>

<div class="card">

    <h2>🌐 Network Visualization</h2>

    <div id="cy"></div>

</div>

<a href="/" class="btn">
    ⬅ Back to Dashboard
</a>

<script>

var elements = {{ cytoscape_data | safe }};

var timeline = {{ timeline_json | safe }};

var cy = cytoscape({

    container: document.getElementById('cy'),

    elements: elements,

    style: [

        {
            selector: 'node',
            style: {
                'label': 'data(id)',
                'background-color': '#2563eb',
                'color': 'white',
                'text-valign': 'center',
                'text-halign': 'center'
            }
        },

        {
            selector: 'edge',
            style: {
                'curve-style': 'bezier',
                'target-arrow-shape': 'triangle',
                'line-color': '#6b7280',
                'target-arrow-color': '#6b7280'
            }
        }

    ],

    layout: {
        name: 'breadthfirst',
        directed: true,
        padding: 30
    }

});

let index = 0;

function infectNextNode(){

    if(index >= timeline.length){
        return;
    }

    let event = timeline[index];

    let nodeName = event.node;

    cy.getElementById(nodeName).style(
        'background-color',
        'red'
    );

    let timelineDiv =
        document.getElementById('timeline');

    timelineDiv.innerHTML +=
        `<div class="event">
            Step ${event.time}
            → ${event.node} infected
            <br>
            Total infected:
            ${event.infected_count}
        </div>`;

    index++;

    setTimeout(
        infectNextNode,
        1000
    );
}

infectNextNode();

</script>

</body>

</html>
